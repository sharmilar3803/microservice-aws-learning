server.port=8082
spring.application.name=file-service

# S3 settings (override with env vars on EC2)
aws.s3.bucket=${S3_BUCKET:my-demo-bucket}
aws.region=${AWS_REGION:ap-south-1}
# Optional: only for local testing against a fake S3 (e.g. moto/LocalStack). Leave empty on AWS.
aws.s3.endpoint=${S3_ENDPOINT:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
